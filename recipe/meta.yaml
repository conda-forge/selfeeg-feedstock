{% set name = "selfeeg" %}
{% set version = "0.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/selfeeg-{{ version }}.tar.gz
  sha256: 846419a4de9cc1496fed6e5b95e7ffe2a3355d670866e43a3efccc0d81b0a6a0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0.0
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - pandas >=1.5.3
    - scipy >=1.10.1
    - pytorch >=2.0.0
    - torchaudio >=2.0.2
    - tqdm

test:
  imports:
    - selfeeg
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/MedMaxLab/selfEEG
  summary: a Python library for Self-Supervised Learning on Electroencephalography (EEG) data
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  doc_url: https://selfeeg.readthedocs.io/en/stable/index.html
  dev_url: https://github.com/MedMaxLab/selfEEG

extra:
  recipe-maintainers:
    - fedepup
